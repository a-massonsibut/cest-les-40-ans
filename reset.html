<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#191970">
    <title>Admin - Réinitialiser le jeu</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000000;
            color: #ffffff;
            font-family: "Comic Sans MS", sans-serif;
            font-size: 14px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 10%, rgba(255, 20, 147, 0.22), transparent 28%),
                radial-gradient(circle at 80% 0%, rgba(0, 191, 255, 0.18), transparent 26%),
                radial-gradient(circle at 50% 100%, rgba(255, 215, 0, 0.12), transparent 30%);
        }

        .page {
            position: relative;
            width: min(980px, 100%);
            margin: 0 auto;
            padding: 12px;
        }

        .header {
            border: 3px solid #ff1493;
            background: linear-gradient(90deg, #9400d3, #4b0082, #000080, #00bfff);
            box-shadow: 0 0 20px #ff1493;
            padding: 14px 12px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: clamp(22px, 7vw, 38px);
            color: #ffffff;
            text-shadow: 2px 2px 0 #ff1493;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .panel {
            border: 1px solid #4b0082;
            background: rgba(25, 25, 112, 0.94);
            padding: 12px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            margin-top: 12px;
        }

        .panel h2 {
            margin: 0 0 10px;
            border-bottom: 1px solid #ffffff;
            color: #ffd700;
            font-size: 15px;
            letter-spacing: 1px;
            padding-bottom: 6px;
            text-align: center;
            text-transform: uppercase;
        }

        label {
            display: block;
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            min-height: 44px;
            border: 1px solid #ff1493;
            background: #000000;
            color: #ffffff;
            font-family: "Comic Sans MS", sans-serif;
            font-size: 16px;
            margin-bottom: 8px;
            padding: 10px;
        }

        button {
            display: inline-block;
            width: 100%;
            min-height: 44px;
            border: 2px solid #ffd700;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff1493, #ff69b4, #ff1493);
            color: #ffffff;
            cursor: pointer;
            font-family: "Comic Sans MS", sans-serif;
            font-size: 13px;
            letter-spacing: 0.5px;
            text-align: center;
            text-transform: uppercase;
            padding: 11px 12px;
            box-shadow: 0 0 10px rgba(255, 20, 147, 0.55);
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .warning {
            border: 1px solid #ffd700;
            background: #3c2500;
            color: #ffffff;
            padding: 10px;
            margin-bottom: 10px;
        }

        .status {
            border: 1px dashed #00bfff;
            border-radius: 8px;
            background: #000000;
            color: #00bfff;
            font-size: 13px;
            line-height: 1.35;
            margin-top: 10px;
            overflow-wrap: anywhere;
            padding: 10px;
            display: none;
        }

        .status.error {
            color: #ff69b4;
            border-color: #ff1493;
        }

        .footer {
            margin: 12px 0 0;
            border-top: 2px solid #ffd700;
            background: linear-gradient(90deg, #9400d3, #4b0082, #000080, #00bfff);
            font-size: 11px;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="header">
            <h1>🧹 Zone organisateur</h1>
        </header>

        <section class="panel" aria-labelledby="resetTitle">
            <h2 id="resetTitle">Réinitialiser le jeu</h2>

            <div class="warning">
                <strong>⚠️ Action irréversible :</strong> efface tous les scores,
                l'historique des scans (base de données) et le tableur des résultats.
                Aucun retour en arrière possible.
            </div>

            <label for="resetPassword">Mot de passe organisateur</label>
            <input type="password" id="resetPassword" name="resetPassword"
                   autocomplete="off" maxlength="100" placeholder="Mot de passe" required>

            <button type="button" id="resetButton" disabled>🧹 Réinitialiser le jeu</button>

            <div class="status" id="resetStatus" role="status"></div>
        </section>

        <footer class="footer">
            © 2026 - Mon Skyblog Anniversaire | Page réservée aux organisateurs
        </footer>
    </main>

    <script>
        const QR_GAME_API_URL = 'https://agnes-scan-430226272134.europe-west9.run.app';
        const QR_GAME_API_KEY = 'd1874d969adfdb720f1c9b2642fd5bec271d84b77089ecc4';

        const elements = {
            password: document.getElementById('resetPassword'),
            resetButton: document.getElementById('resetButton'),
            resetStatus: document.getElementById('resetStatus')
        };

        elements.password.addEventListener('input', () => {
            elements.resetButton.disabled = elements.password.value.length === 0;
        });

        elements.resetButton.addEventListener('click', async () => {
            const password = elements.password.value.trim();
            if (!password) return;

            if (!confirm('Vider tous les scores et l\'historique ? Action irréversible.')) return;
            if (!confirm('Dernière chance : confirmer le reset ?')) return;

            elements.resetButton.disabled = true;
            showStatus('⏳ Réinitialisation en cours...', false);

            try {
                const response = await fetch(QR_GAME_API_URL + '/reset', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': QR_GAME_API_KEY
                    },
                    body: JSON.stringify({ password })
                });

                if (response.ok) {
                    showStatus('✅ Jeu réinitialisé. La base est vide, le tableur sera vidé d\'ici une minute.', false);
                } else if (response.status === 401) {
                    showStatus('❌ Mot de passe invalide.', true);
                } else {
                    const data = await response.json().catch(() => ({}));
                    showStatus('❌ Erreur : ' + (data.error || 'Réponse ' + response.status), true);
                }
            } catch (error) {
                showStatus('❌ Impossible de contacter le serveur. Réessaie dans quelques secondes.', true);
            } finally {
                elements.resetButton.disabled = elements.password.value.length === 0;
            }
        });

        function showStatus(message, isError) {
            elements.resetStatus.textContent = message;
            elements.resetStatus.classList.toggle('error', Boolean(isError));
            elements.resetStatus.style.display = 'block';
        }
    </script>
</body>
</html>
