name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branche ou commit SHA à déployer (vide = le ref depuis lequel le workflow est lancé)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Exclure .git de l'artifact
        run: rm -rf .git
      - name: Configurer Pages
        uses: actions/configure-pages@v5
      - name: Upload de l'artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4