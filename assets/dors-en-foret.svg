<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" font-family="'Comic Sans MS', 'Arial Black', sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0033"/>
      <stop offset="0.6" stop-color="#4b0082"/>
      <stop offset="1" stop-color="#ff1493"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e5d2e"/>
      <stop offset="1" stop-color="#143514"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffacd"/>
      <stop offset="1" stop-color="#ffd700"/>
    </radialGradient>
    <style>
      .twk1 { animation: tw 1.4s infinite steps(1); }
      .twk2 { animation: tw 1.4s infinite steps(1); animation-delay: 0.5s; }
      .twk3 { animation: tw 1.4s infinite steps(1); animation-delay: 0.9s; }
      .zz1 { animation: zfly 3s infinite; }
      .zz2 { animation: zfly 3s infinite; animation-delay: 1s; }
      .zz3 { animation: zfly 3s infinite; animation-delay: 2s; }
      .sleeper { animation: snr 2.2s infinite ease-in-out; transform-origin: center; }
      @keyframes tw { 0%,49%{opacity:1} 50%,100%{opacity:0.15} }
      @keyframes zfly { 0%{opacity:0; transform: translate(0,0) scale(0.6)} 15%{opacity:1} 100%{opacity:0; transform: translate(18px,-32px) scale(1.3)} }
      @keyframes snr { 0%,100%{transform: scaleY(1)} 50%{transform: scaleY(1.06)} }
      @media (prefers-reduced-motion: reduce) { *{animation:none!important} }
    </style>
  </defs>

  <!-- Night sky -->
  <rect width="320" height="240" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#fff" font-size="12" font-weight="bold">
    <text class="twk1" x="30"  y="28">✦</text>
    <text class="twk2" x="70"  y="50">✦</text>
    <text class="twk3" x="120" y="22">✦</text>
    <text class="twk1" x="180" y="44">✦</text>
    <text class="twk2" x="230" y="24">✦</text>
    <text class="twk3" x="280" y="56">✦</text>
    <text class="twk2" x="50"  y="80">✦</text>
    <text class="twk1" x="300" y="92">✦</text>
  </g>

  <!-- Moon -->
  <circle cx="262" cy="58" r="20" fill="url(#moon)"/>
  <circle cx="255" cy="52" r="4" fill="#e6c700" opacity="0.5"/>
  <circle cx="268" cy="64" r="3" fill="#e6c700" opacity="0.5"/>

  <!-- Pine trees -->
  <g fill="#0d2d0d">
    <polygon points="20,170 5,200 35,200"/>
    <polygon points="20,150 8,178 32,178"/>
    <polygon points="300,168 286,198 314,198"/>
    <polygon points="300,148 289,176 311,176"/>
    <polygon points="55,176 44,205 66,205"/>
    <polygon points="268,176 257,205 279,205"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="200" width="320" height="40" fill="url(#ground)"/>

  <!-- Tent -->
  <g>
    <polygon points="160,205 110,205 135,150" fill="#ff1493" stroke="#fff" stroke-width="2"/>
    <polygon points="160,205 210,205 185,150" fill="#c71585" stroke="#fff" stroke-width="2"/>
    <polygon points="135,150 185,150 160,120" fill="#ffd700" stroke="#fff" stroke-width="2"/>
    <rect x="150" y="178" width="20" height="27" fill="#1a0033"/>
  </g>

  <!-- Sleeping bag / sleeper inside tent -->
  <g class="sleeper">
    <ellipse cx="160" cy="190" rx="14" ry="6" fill="#7df9ff"/>
    <circle cx="148" cy="188" r="3.5" fill="#ffd9b3"/>
  </g>

  <!-- Snoring Zs -->
  <g fill="#fff" font-weight="bold" font-size="16">
    <text class="zz1" x="168" y="176">Z</text>
    <text class="zz2" x="168" y="176">Z</text>
    <text class="zz3" x="168" y="176">Z</text>
  </g>

  <!-- Retro caption -->
  <text x="160" y="232" text-anchor="middle" fill="#ffd700" font-size="13" font-weight="bold">Dors en forêt 🌲💤</text>
</svg>
